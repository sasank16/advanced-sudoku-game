<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Sudoku - Advanced Sudoku Game</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
        <line x1="15" y1="3" x2="15" y2="21"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="3" y1="15" x2="21" y2="15"/>
      </svg>
      <span>Advanced Sudoku</span>
    </a>

    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="game.html" class="nav-link active">Play</a></li>
      <li><a href="statistics.html" class="nav-link">Statistics</a></li>
      <li><a href="leaderboard.html" class="nav-link">Leaderboard</a></li>
      <li><a href="settings.html" class="nav-link">Settings</a></li>
    </ul>

    <div class="nav-actions">
      <button id="theme-toggle" class="btn-icon" title="Toggle Dark/Light Mode">
        <span id="theme-icon">☀️</span>
      </button>
      <div id="nav-auth-container">
        <!-- Injected dynamically by auth.js -->
      </div>
      <button class="mobile-nav-toggle btn-icon">☰</button>
    </div>
  </nav>

  <!-- Main Game Container -->
  <main class="main-container">
    
    <!-- Status & Info Card -->
    <div class="game-header-card">
      <div class="stat-group">
        <span>Difficulty:</span>
        <span id="difficulty-badge" class="badge-difficulty badge-medium">Medium</span>
      </div>

      <div class="stat-group">
        <span>Mistakes:</span>
        <span id="mistakes-display" class="stat-value" style="color: var(--danger);">0 / 3</span>
      </div>

      <div class="stat-group">
        <span>Hints:</span>
        <span id="hints-display" class="stat-value">0</span>
      </div>

      <div class="stat-group">
        <span>⏱️ Time:</span>
        <span id="timer-display" class="stat-value" style="font-size: 1.1rem; color: var(--accent-secondary);">00:00</span>
      </div>

      <div style="display: flex; gap: 0.5rem;">
        <button id="btn-pause" class="btn btn-secondary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
          ⏸️ Pause
        </button>
        <button id="btn-new-game" class="btn btn-primary" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
          ➕ New Game
        </button>
      </div>
    </div>

    <!-- Main Game Grid & Sidebar -->
    <div class="game-container">
      
      <!-- Board Area -->
      <div class="board-wrapper">
        <div id="sudoku-board" class="sudoku-board">
          <!-- 9x9 cells populated dynamically by board.js -->
        </div>

        <!-- Pause Overlay -->
        <div id="pause-overlay" class="pause-overlay" style="display: none;">
          <h2 style="font-size: 2rem; font-weight: 800;">⏸️ Game Paused</h2>
          <p style="color: var(--text-secondary);">Board is hidden while paused.</p>
          <button id="resume-overlay-btn" class="btn btn-primary" style="padding: 0.75rem 2rem; font-size: 1rem; margin-top: 0.5rem;">
            Resume Game
          </button>
        </div>
      </div>

      <!-- Sidebar Controls -->
      <div class="game-sidebar">
        
        <!-- Action Toolbar -->
        <div class="action-toolbar">
          <button id="btn-undo" class="action-btn" title="Undo (Ctrl+Z / U)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 7v6h6"/>
              <path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/>
            </svg>
            <span>Undo</span>
          </button>

          <button id="btn-redo" class="action-btn" title="Redo (Ctrl+Y)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 7v6h-6"/>
              <path d="M3 17a9 9 0 019-9 9 9 0 016 2.3l3 2.7"/>
            </svg>
            <span>Redo</span>
          </button>

          <button id="btn-erase" class="action-btn" title="Erase (Backspace/Del)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 20H7L3 16C2 15 2 13 3 12L13 2C14 1 16 1 17 2L22 7C23 8 23 10 22 11L11 22"/>
            </svg>
            <span>Erase</span>
          </button>

          <button id="btn-pencil" class="action-btn" title="Toggle Pencil Notes (P)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
            </svg>
            <span>Pencil</span>
          </button>
        </div>

        <!-- 1-9 Number Pad -->
        <div class="numpad">
          <button class="num-btn" data-number="1">1 <span class="num-count">9 left</span></button>
          <button class="num-btn" data-number="2">2 <span class="num-count">9 left</span></button>
          <button class="num-btn" data-number="3">3 <span class="num-count">9 left</span></button>
          <button class="num-btn" data-number="4">4 <span class="num-count">9 left</span></button>
          <button class="num-btn" data-number="5">5 <span class="num-count">9 left</span></button>
          <button class="num-btn" data-number="6">6 <span class="num-count">9 left</span></button>
          <button class="num-btn" data-number="7">7 <span class="num-count">9 left</span></button>
          <button class="num-btn" data-number="8">8 <span class="num-count">9 left</span></button>
          <button class="num-btn" data-number="9">9 <span class="num-count">9 left</span></button>
        </div>

        <!-- Intelligent Hint Button -->
        <button id="btn-hint" class="btn btn-secondary" style="padding: 0.85rem; width: 100%; border-color: var(--accent-primary); font-size: 0.95rem;">
          💡 Get Intelligent Hint (H)
        </button>

        <!-- Keyboard Shortcuts Helper -->
        <div class="card" style="padding: 1rem; font-size: 0.8rem; color: var(--text-muted);">
          <div style="font-weight: 700; color: var(--text-secondary); margin-bottom: 0.4rem;">⌨️ Keyboard Shortcuts</div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.25rem;">
            <div><kbd>1-9</kbd> Enter number</div>
            <div><kbd>P</kbd> Toggle pencil</div>
            <div><kbd>Del</kbd> Erase</div>
            <div><kbd>U</kbd> Undo</div>
            <div><kbd>H</kbd> Hint</div>
            <div><kbd>Space</kbd> Pause</div>
            <div><kbd>Arrows</kbd> Navigate</div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/board.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
