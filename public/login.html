<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Advanced Sudoku Game</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
        <line x1="15" y1="3" x2="15" y2="21"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="3" y1="15" x2="21" y2="15"/>
      </svg>
      <span>Advanced Sudoku</span>
    </a>

    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="game.html" class="nav-link">Play</a></li>
      <li><a href="statistics.html" class="nav-link">Statistics</a></li>
      <li><a href="leaderboard.html" class="nav-link">Leaderboard</a></li>
      <li><a href="settings.html" class="nav-link">Settings</a></li>
    </ul>

    <div class="nav-actions">
      <button id="theme-toggle" class="btn-icon" title="Toggle Dark/Light Mode">
        <span id="theme-icon">☀️</span>
      </button>
      <div id="nav-auth-container"></div>
    </div>
  </nav>

  <!-- Login Card Form -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Login to track your statistics, sync puzzles, and rank on the leaderboard.</p>
      </div>

      <div id="auth-error" class="error-banner"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email or Username</label>
          <input type="text" id="login-email" class="form-input" placeholder="e.g. master_solver or user@domain.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="register.html" class="auth-link">Create Account</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;
      Auth.login(email, pass);
    });
  </script>
</body>
</html>
